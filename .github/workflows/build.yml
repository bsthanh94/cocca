name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Archive (No Code Sign)
        run: |
          xcodebuild clean archive \
            -project AgeTracker.xcodeproj \
            -scheme AgeTracker \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/AgeTracker.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into Unsigned IPA
          run: |
            set -euxo pipefail
            APP_PATH="${{ runner.temp }}/AgeTracker.xcarchive/Products/Applications/AgeTracker.app"
            echo "=== Kiểm tra .app có tồn tại không ==="
            ls -la "$(dirname "$APP_PATH")"
            test -d "$APP_PATH" || (echo "LỖI: Không tìm thấy $APP_PATH" && exit 1)
            echo "=== Đóng gói IPA ==="
            mkdir -p Payload dist
            cp -R "$APP_PATH" Payload/
            zip -r dist/AgeTracker-unsigned.ipa Payload
            echo "=== Kiểm tra file IPA đã tạo ==="
            ls -la dist/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgeTracker-unsigned-ipa
          path: dist/AgeTracker-unsigned.ipa
          if-no-files-found: error
