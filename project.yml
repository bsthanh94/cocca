name: AgeTracker
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
  postGenCommand: sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 60|' AgeTracker.xcodeproj/project.pbxproj
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  AgeTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.AgeTracker
        INFOPLIST_KEY_CFBundleDisplayName: "Coca"
